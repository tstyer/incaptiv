</style></head><body><aside id="sidebar"><div class="brand"><div class="brandmark"><i></i><i></i><i></i></div>incaptiv<span style="font-size:8px;align-self:flex-start;margin-top:4px">®</span></div><div class="by">BY VENUELOGIC</div><div class="navlabel">WORKSPACE</div><nav id="nav"></nav><div class="asidebottom"><div class="connection"><span class="dot"></span>Demo workspace</div><div class="profile"><div class="avatar">TS</div><div><b>Travis Styer</b><small>Venue administrator</small></div><span style="margin-left:auto;color:#96a091">⌄</span></div></div></aside><main><header class="topbar"><div class="venue"><button class="mobilemenu" aria-label="Open navigation" onclick="document.getElementById('sidebar').classList.toggle('show')">☰</button><div class="venueicon" id="venueIcon"></div><select id="venue" aria-label="Select venue"><option>The Glasshouse, London</option><option>Riverside Hall, Bristol</option></select></div><div class="topright"><span class="demobadge">DEMO DATA</span><span class="updated"><span class="dot"></span>Sample period · October 2026</span><button title="Data sources" aria-label="View data sources" onclick="go(6)" id="infoicon"></button></div></header><div class="content" id="app"></div></main><div id="details" class="details" onclick="if(event.target===this)closeDrawer()"><section class="drawer" id="drawer"></section></div><script>
const paths={dashboard:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',zones:'M3 4h18v16H3z M10 4v16 M10 12h11',events:'M4 5h16v16H4z M8 2v6 M16 2v6 M4 11h16',revenue:'M3 19h18 M6 15V9 M12 15V4 M18 15v-8',visitors:'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M2 21v-3a7 7 0 0 1 14 0v3 M17 4a4 4 0 0 1 0 8 M18 15a6 6 0 0 1 4 6',ai:'M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z',settings:'M4 21V8l8-5 8 5v13z M9 21v-7h6v7 M8 9h.1 M16 9h.1',arrow:'M5 12h14 M14 7l5 5-5 5',download:'M12 3v12 M7 10l5 5 5-5 M4 16v5h16v-5',info:'M12 10v7 M12 7h.01 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',clock:'M12 8v5l3 2 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',money:'M3 6h18v13H3z M16 12h5 M7 10h3',trend:'M3 17l6-6 4 4 8-10 M15 5h6v6'};
const icon=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[n]||paths.zones}"/></svg>`;
const screens=['Executive dashboard','Zones analytics','Events analytics','Revenue intelligence','Visitor behaviour','AI insights','Venue management'], keys=['dashboard','zones','events','revenue','visitors','ai','settings'];
let page=0,period='month',zoneFilter='all',venue=0;let accepted=JSON.parse(localStorage.getItem('incaptiv-actions')||'[]');let venueNames=JSON.parse(localStorage.getItem('incaptiv-venues')||'null')||['The Glasshouse, London','Riverside Hall, Bristol'];let zoneData=[['Main hall',8420,52480,28700,23780,28.4,'Performing well'],['The terrace',4360,28350,14900,13450,32.1,'Performing well'],['Garden bar',3890,24760,12800,11960,30.8,'Performing well'],['Gallery lounge',2170,9680,11250,-1570,38.5,'Needs attention']];
const factor=()=> (period==='week'?.26:period==='today'?.037:1)*(venue?.68:1);const fmt=n=>Math.round(n*factor()).toLocaleString('en-GB'),money=n=>'£'+fmt(n);const total=i=>zoneData.reduce((s,z)=>s+z[i],0);const labelPeriod=()=>period==='month'?'1–31 Oct 2026':period==='week'?'25–31 Oct 2026':'31 Oct 2026';
function go(i){page=i;render();document.getElementById('sidebar').classList.remove('show');window.scrollTo(0,0)}
function nav(){document.getElementById('nav').innerHTML=screens.map((n,i)=>`${i===6?'<div class="navlabel" style="margin-top:29px">MANAGE</div>':''}<button class="nav ${i===page?'active':''}" onclick="go(${i})">${icon(keys[i])}<span>${n}</span>${i===5?'<em>AI</em>':''}</button>`).join('')}
function heading(title,sub,extra=''){return `<div class="heading"><div><h1>${title}</h1><p class="subtitle">${sub}</p></div><div class="tools">${extra}${page!==6?`<select class="filter" aria-label="Reporting period" onchange="period=this.value;render()"><option value="month" ${period==='month'?'selected':''}>${period==='month'?'1–31 Oct 2026':'October 2026'}</option><option value="week" ${period==='week'?'selected':''}>Last 7 days</option><option value="today" ${period==='today'?'selected':''}>31 Oct 2026</option></select><button class="btn" onclick="exportCSV()">${icon('download',14)} Export</button>`:''}</div></div>`}
function stat(title,value,change,ico='trend',note='vs previous period'){return `<div class="stat"><div class="statlabel">${title}${icon(ico,16)}</div><div class="number">${value}</div><div class="change"><span class="up">↗ ${change}</span>${note}</div></div>`}
function stats(){return `<div class="stats">${stat('Linked sales revenue',money(total(2)),'12.8%','money')}${stat('Estimated footfall',fmt(14680),'8.2%','visitors')}${stat('Operating profit',money(total(4)),'16.4%','trend')}${stat('Peak estimated occupancy','76%','380 of 500 capacity','visitors',' · demo')}</div>`}
function chart(type='revenue'){let v=type==='visitors';return `<svg class="chart" viewBox="0 0 640 230" role="img" aria-label="${v?'Estimated occupancy':'Linked sales and estimated visits'} trend for the selected demo reporting period"><defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dce9d9" stop-opacity=".65"/><stop offset="1" stop-color="#eef4eb" stop-opacity=".08"/></linearGradient></defs>${[20,65,110,155,200].map((y,i)=>`<line class="gridline" x1="42" y1="${y}" x2="618" y2="${y}"/><text x="0" y="${y+4}">${v?[400,300,200,100,0][i]:['£8k','£6k','£4k','£2k','£0'][i]}</text>`).join('')}<path d="M42 160 C65 155 65 168 86 155 S115 135 130 142 S155 154 170 135 S195 96 213 118 S236 155 253 135 S275 85 291 100 S320 127 337 105 S365 93 383 113 S409 127 425 101 S445 54 463 70 S489 126 505 97 S529 55 546 67 S568 87 582 50 S602 50 618 40 L618 200 L42 200Z" fill="url(#fade)"/><path d="M42 174 C70 155 80 180 105 165 S140 176 165 155 S200 135 220 148 S248 164 267 150 S297 130 315 139 S347 143 365 133 S398 145 418 127 S447 106 465 120 S493 139 513 119 S540 99 558 112 S595 108 618 96" fill="none" stroke="#b3c4aa" stroke-width="2" stroke-dasharray="5 5"/><path d="M42 160 C65 155 65 168 86 155 S115 135 130 142 S155 154 170 135 S195 96 213 118 S236 155 253 135 S275 85 291 100 S320 127 337 105 S365 93 383 113 S409 127 425 101 S445 54 463 70 S489 126 505 97 S529 55 546 67 S568 87 582 50 S602 50 618 40" fill="none" stroke="#357653" stroke-width="2.5"/>${['01 Oct','05 Oct','10 Oct','15 Oct','20 Oct','25 Oct','31 Oct'].map((x,i)=>`<text x="${42+i*95}" y="225" text-anchor="middle">${period==='month'?x:period==='week'?['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]:['10am','12pm','2pm','4pm','6pm','8pm','10pm'][i]}</text>`).join('')}</svg>`}
function revenuePanel(){return `<section class="panel"><div class="panelhead"><div><h2>Revenue & visitor trends</h2><div class="tiny">See how activity translates into sales</div></div><div class="legend"><span>Revenue</span><span>Visits, indexed*</span></div></div>${chart()}<div class="insight">${icon('ai',17)}<p><strong>More visitors. Even more value.</strong>Linked sales grew 12.8% while estimated visits rose 8.2%. Weekend activity led the increase.</p></div><div class="tiny" style="margin-top:10px">*Visit trend scaled for comparison. Revenue is from linked sales records.</div></section>`}
function ranking(){return `<section class="panel"><div class="panelhead"><div><h2>Where revenue happens</h2><div class="tiny">Linked sales by zone</div></div><span class="tiny">${icon('zones',16)}</span></div>${zoneData.map((z,i)=>`<div class="rank"><div>${z[0]}<small>${Math.round(z[2]/total(2)*100)}% of venue revenue</small></div><b style="font-weight:500">${money(z[2])}</b></div><div class="track ${i===1?'alt':i>1?'light':''}"><i style="width:${z[2]/zoneData[0][2]*100}%"></i></div>`).join('')}<div class="panelbottom"><span>4 active zones</span><button class="link" onclick="go(1)">Explore zones →</button></div></section>`}
function zoneTable(){let rows=zoneData.filter(z=>zoneFilter==='all'||(zoneFilter==='attention'?z[4]<0:z[4]>=0));return `<div class="tablewrap"><table><thead><tr><th>ZONE</th><th>EST. VISITS</th><th>LINKED REVENUE</th><th>OPERATING COSTS</th><th>PROFIT</th><th>STATUS</th><th></th></tr></thead><tbody>${rows.map(z=>`<tr class="clickable" onclick="zoneDetail(${zoneData.indexOf(z)})"><td><div class="zonecell"><span class="zoneicon">${icon('zones',15)}</span>${z[0]}</div></td><td>${fmt(z[1])}</td><td>${money(z[2])}</td><td>${money(z[3])}</td><td style="color:${z[4]<0?'#a88852':'#426c48'}">${z[4]<0?'−':''}${money(Math.abs(z[4]))}</td><td><span class="tag ${z[4]<0?'warn':''}">${z[6]}</span></td><td><button class="link" aria-label="View ${z[0]} details" onclick="event.stopPropagation();zoneDetail(${zoneData.indexOf(z)})">↗</button></td></tr>`).join('')}</tbody></table></div>`}
function dashboard(){return heading('A clearer view of your venue.','Your performance at a glance. Every visitor, every space, every opportunity.')+stats()+`<div class="grid">${revenuePanel()}${ranking()}</div><section class="panel"><div class="panelhead"><div><h2>Zone performance</h2><div class="tiny">Understand what’s working — and where to focus next</div></div><button class="link" onclick="go(1)">View all zones →</button></div>${zoneTable()}</section>`}
function zones(){return heading('Every space has a story.','Compare activity, linked sales and operating profit across your venue.')+`<div class="stats">${stat('Active zones','4','All reporting','zones','')}${stat('Most profitable','Main hall',money(23780),'trend',' operating profit')}${stat('Highest spend / visit','Garden bar','£6.37','money',' per estimated visit')}${stat('Needs attention','1 zone','Gallery lounge','zones','')}</div><section class="panel"><div class="panelhead"><div><h2>Zone comparison</h2><div class="tiny">Select a zone to explore its performance</div></div><select class="filter" aria-label="Filter zones" onchange="zoneFilter=this.value;render()"><option value="all" ${zoneFilter==='all'?'selected':''}>All zones</option><option value="profitable" ${zoneFilter==='profitable'?'selected':''}>Profitable zones</option><option value="attention" ${zoneFilter==='attention'?'selected':''}>Needs attention</option></select></div>${zoneTable()}</section><div class="split" style="margin-top:22px">${ranking()}<section class="panel"><h2>A space worth a closer look</h2><p style="font-size:12px;margin:20px 0">Gallery lounge welcomed ${fmt(2170)} estimated visits, but operating costs exceeded linked sales by ${money(1570)}.</p><div class="insight">${icon('ai')}<p><strong>Review quiet-period staffing</strong>Compare hourly demand with staffing costs before adjusting the lounge’s opening hours.</p></div><button class="btn" style="margin-top:25px" onclick="zoneDetail(3)">Explore Gallery lounge ${icon('arrow',14)}</button></section></div>`}
const events=[['Late Sessions','24 Oct · Main hall',1120,13840,6400,'Evening music','24'],['Garden Social','17 Oct · Terrace & garden',860,9460,5200,'Food & drink','17'],['Art After Hours','10 Oct · Gallery lounge',420,3780,4150,'Exhibition','10']];
function eventPage(){return heading('Make your next event count.','Discover the events that bring people in — and deliver a return.')+`<div class="stats">${stat('Events this period','3','Completed','events','')}${stat('Event-linked revenue',money(27080),'18.2%','money')}${stat('Estimated event visits',fmt(2400),'11.6%','visitors')}${stat('Best event ROI','116%','Late Sessions','trend','')}</div><div class="cards">${events.map((e,i)=>`<section class="panel"><div class="eventart" style="background:${i===1?'#eeeade':i===2?'#eaeef0':'#e8efdf'}"><b>${e[6]}<span style="font-size:14px"> OCT</span></b><span>${e[5]}<br>OCTOBER SERIES</span></div><span class="tag ${i===2?'warn':''}">${i===2?'Below break-even':'Profitable event'}</span><h2 style="font-size:19px;margin:17px 0 7px">${e[0]}</h2><p class="tiny">${e[1]}</p><div class="eventstats"><div><small>Linked revenue</small><b>${money(e[3])}</b></div><div><small>Event ROI</small><b style="color:${i===2?'#ac8954':'#39734e'}">${Math.round((e[3]-e[4])/e[4]*100)}%</b></div></div><div class="panelbottom"><span>${fmt(e[2])} estimated visits</span><button class="link" onclick="eventDetail(${i})">View event →</button></div></section>`).join('')}</div><section class="panel" style="margin-top:22px"><h2>How event ROI is calculated</h2><p class="tiny">(Event-linked revenue − allocated event costs) ÷ allocated event costs × 100. Event visits use the event time window and associated zones; visitors may attend more than one event.</p></section>`}
function revenue(){return heading('Turn activity into opportunity.','Understand the relationship between visitors, sales and costs.')+stats()+`<div class="grid">${revenuePanel()}<section class="panel"><h2>Revenue mix</h2><div class="tiny">Sales recorded in the demo POS feed</div>${[['Food & drink',67162,58],['Event tickets',28570,25],['Retail & other',19538,17]].map((x,i)=>`<div class="rank"><span>${x[0]}</span><span>${money(x[1])} <small style="display:inline">· ${x[2]}%</small></span></div><div class="track ${i?'light':''}"><i style="width:${x[2]}%"></i></div>`).join('')}<div class="insight" style="margin-top:30px"><p><strong>Sales have a source</strong>Wi-Fi activity provides visit signals. Revenue comes from connected sales records; Wi-Fi login alone does not record a purchase.</p></div></section></div><section class="panel"><div class="panelhead"><div><h2>Sales attribution</h2><div class="tiny">Know how much of the picture is connected</div></div><button class="link" onclick="methodology()">View methodology →</button></div><div class="split" style="margin:0"><div><div class="number">62% <span class="tiny">of sales value matched to a guest identifier</span></div><div class="track"><i style="width:62%"></i></div></div><p class="tiny">All linked sales contribute to zone totals using the sale’s location and time. Only records with a shared guest identifier contribute to guest-level purchase analysis. Unmatched sales remain in venue totals.</p></div></section>`}

let appPrefs=JSON.parse(localStorage.getItem('incaptiv-preferences')||'null')||{largerText:false,reduceMotion:false,revenueAlerts:true,occupancyAlerts:true,eventSummary:false};
const baseDrawer=drawer,baseCloseDrawer=closeDrawer;
drawer=function(html){let el=document.getElementById('drawer');el.classList.remove('menuview');baseDrawer(html);el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Details');el.querySelector('button')?.focus()};
function menuShell(title,html){let el=document.getElementById('drawer');baseDrawer('');el.classList.add('menuview');el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label',title);el.innerHTML=`<div class="menuheading"><h2>${title}</h2><button class="menuclose" aria-label="Close menu" onclick="closeDrawer()">×</button></div>`+html;el.querySelector('button').focus()}
closeDrawer=function(){baseCloseDrawer();document.querySelector('.menutrigger')?.focus()};
function menuGo(i){closeDrawer();go(i)}
function menuItem(title,key,action,current=false){return `<button class="menuitem ${current?'current':''}" onclick="${action}">${icon(key,18)}<span>${title}</span><span class="menuarrow">›</span></button>`}
function openMenu(){menuShell('Your workspace',`<div class="menuprofile"><div class="avatar">TS</div><div><b>Travis Styer</b><small>Venue administrator · Demo account</small></div></div><div class="menucaption">EXPLORE</div>${[[0,'Home','dashboard'],[7,'Ask Incaptiv','chat'],[1,'Zones','zones'],[2,'Events','events'],[3,'Revenue intelligence','revenue'],[4,'Visitor behaviour','visitors'],[5,'Insights','ai']].map(([i,t,k])=>menuItem(t,k,'menuGo('+i+')',page===i)).join('')}<div class="menudivider"></div><div class="menucaption">YOUR VENUE</div>${menuItem('Switch venue','settings','switchVenueMenu()')}${menuItem('Venue management','zones','menuGo(6)')}${menuItem('Export zone report','download','closeDrawer();go(1);exportCSV()')}<div class="menudivider"></div><div class="menucaption">PREFERENCES & SUPPORT</div>${menuItem('Settings','settings','openSettings()')}${menuItem('Help & data guide','info','openHelp()')}<div class="menufooter">INCAPTIV BY VENUELOGIC<br>Mobile prototype · Demo data</div>`)}
function settingToggle(key,title,desc){return `<div class="settingrow"><div><b>${title}</b><small>${desc}</small></div><button class="switch" role="switch" aria-label="${title}" aria-checked="${!!appPrefs[key]}" onclick="togglePref('${key}',this)"><span></span></button></div>`}
function openSettings(){menuShell('Settings',`<button class="reportback" onclick="openMenu()">← Workspace menu</button><p class="settingsub">Make Incaptiv comfortable to use. Preferences are saved on this browser.</p><div class="menucaption">APPEARANCE & ACCESSIBILITY</div><div class="settinggroup">${settingToggle('largerText','Larger text','Increase small labels and body text.')}${settingToggle('reduceMotion','Reduce motion','Turn off animated transitions.')}</div><div class="menucaption">NOTIFICATION PREFERENCES</div><div class="settinggroup">${settingToggle('revenueAlerts','Revenue alerts','Flag changes in sales performance.')}${settingToggle('occupancyAlerts','Occupancy alerts','Flag estimated capacity thresholds.')}${settingToggle('eventSummary','Event summaries','Receive a summary after an event.')}</div><p class="settingsub">Notification controls are saved as demo preferences. This prototype does not send push notifications or emails.</p><div class="menucaption">ACCOUNT & ACCESS</div><div class="settinggroup"><div class="settingrow"><div><b>Travis Styer</b><small>Venue administrator · Demo account</small></div></div><div class="settingrow"><div><b>Reporting preferences</b><small>GBP (£) · Europe/London</small></div></div></div>${menuItem('View role permissions','visitors','roles()')}`)}
function applyPrefs(){document.body.classList.toggle('largeText',!!appPrefs.largerText);document.body.classList.toggle('reduceMotion',!!appPrefs.reduceMotion)}
function togglePref(key,btn){appPrefs[key]=!appPrefs[key];localStorage.setItem('incaptiv-preferences',JSON.stringify(appPrefs));btn.setAttribute('aria-checked',String(appPrefs[key]));applyPrefs()}
function switchVenueMenu(){menuShell('Switch venue',`<button class="reportback" onclick="openMenu()">← Workspace menu</button><p class="settingsub">Choose the venue you want to explore.</p><label class="form" for="menuVenue">Current venue</label><select class="venuepick" id="menuVenue" onchange="selectMenuVenue(this.value)">${venueNames.map((n,i)=>`<option value="${i}" ${i===venue?'selected':''}>${safe(n)}</option>`).join('')}</select><div class="insight"><p><strong>Your workspace follows your venue</strong>Switching venues clears the current demo chat so answers stay within the selected venue.</p></div>`)}
function selectMenuVenue(value){venue=+value;chatMessages=[];chatContext=null;syncVenues();render();closeDrawer();toast('Switched to '+venueNames[venue])}
function openHelp(){menuShell('Help & data guide',`<button class="reportback" onclick="openMenu()">← Workspace menu</button><p class="settingsub">A quick guide to getting more from Incaptiv.</p><div class="settinggroup"><div class="settingrow"><div><b>Ask a question</b><small>Use Ask to explore an event’s estimated occupancy, linked revenue and operating costs. Name an event or zone to keep your question focused.</small></div></div><div class="settingrow"><div><b>Explore a record</b><small>Tap a zone or event card to view its performance. Event details also link straight to chat.</small></div></div><div class="settingrow"><div><b>Read the data correctly</b><small>Wi-Fi provides visitor activity signals. Sales come from linked purchase records. Attendance and occupancy are estimates.</small></div></div></div>${menuItem('Measurement methodology','info','methodology()')}${menuItem('View demo data sources','settings','menuGo(6)')}<div class="insight"><p><strong>About this prototype</strong>Figures and assistant responses are illustrative. Wi-Fi, POS and live AI services are not connected.</p></div>`)}
// Keep keyboard focus inside an open menu or detail panel.
document.addEventListener('keydown',e=>{if(e.key!=='Tab'||!document.getElementById('details').classList.contains('open'))return;let focusables=[...document.getElementById('drawer').querySelectorAll('button,input,select,a,[tabindex="0"]')].filter(el=>!el.disabled);if(!focusables.length)return;let first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
applyPrefs();document.querySelector('.menutrigger').innerHTML=icon('menu',22);
</script></body></html>
